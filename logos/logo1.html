<!DOCTYPE html>
<html><head><style>
body { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#1a1a2e; margin:0; font-family:Arial; }
.card { text-align:center; margin:20px; }
.card h3 { color:#fff; margin-top:15px; }
svg { filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4)); }
</style></head><body>
<div class="card">
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C853"/>
      <stop offset="100%" style="stop-color:#1B5E20"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#g1)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <!-- Chapeau -->
  <polygon points="50,95 100,65 150,95 130,100 70,100" fill="#212121"/>
  <rect x="60" y="95" width="80" height="8" rx="2" fill="#333"/>
  <line x1="100" y1="65" x2="135" y2="85" stroke="#F44336" stroke-width="3" stroke-linecap="round"/>
  <circle cx="135" cy="85" r="4" fill="#F44336"/>
  <!-- Lettres SM -->
  <text x="100" y="135" text-anchor="middle" font-family="Georgia,serif" font-size="42" font-weight="bold" fill="#fff" letter-spacing="4">SM</text>
  <!-- Ligne décorative -->
  <line x1="55" y1="145" x2="145" y2="145" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <text x="100" y="162" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.7)" letter-spacing="3">BURKINA FASO</text>
</svg>
<h3>Option 1 — Classique Vert</h3>
</div>
</body></html>
