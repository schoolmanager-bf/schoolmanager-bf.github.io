<!DOCTYPE html>
<html><head><style>
body { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#1a1a2e; margin:0; }
.card { text-align:center; margin:20px; }
.card h3 { color:#fff; margin-top:15px; font-family:Arial; }
svg { filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4)); }
</style></head><body>
<div class="card">
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CE1126"/>
      <stop offset="50%" style="stop-color:#009739"/>
      <stop offset="100%" style="stop-color:#FCD116"/>
    </linearGradient>
  </defs>
  <!-- Carré arrondi -->
  <rect x="5" y="5" width="190" height="190" rx="40" fill="url(#g5)"/>
  <rect x="12" y="12" width="176" height="176" rx="34" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <!-- Étoile du drapeau -->
  <polygon points="100,35 106,52 124,52 110,62 115,80 100,70 85,80 90,62 76,52 94,52" fill="#FCD116"/>
  <!-- SM blanc -->
  <text x="100" y="118" text-anchor="middle" font-family="Georgia,serif" font-size="48" font-weight="bold" fill="#fff" letter-spacing="3">SM</text>
  <!-- Sous-titre -->
  <text x="100" y="145" text-anchor="middle" font-family="Arial" font-size="12" fill="rgba(255,255,255,0.9)" letter-spacing="3" font-weight="600">SCHOOL MANAGER</text>
  <!-- Ligne fine -->
  <line x1="60" y1="155" x2="140" y2="155" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="100" y="172" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.6)" letter-spacing="5">BURKINA FASO</text>
</svg>
<h3>Option 5 — Drapeau BF</h3>
</div>
</body></html>
