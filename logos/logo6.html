<!DOCTYPE html>
<html><head><style>
body { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#1a1a2e; margin:0; }
.card { text-align:center; margin:20px; }
.card h3 { color:#fff; margin-top:15px; font-family:Arial; }
svg { filter: drop-shadow(0 6px 20px rgba(0,0,0,0.5)); }
</style></head><body>
<div class="card">
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFA5"/>
      <stop offset="100%" style="stop-color:#1DE9B6"/>
    </linearGradient>
  </defs>
  <!-- Fond -->
  <rect x="0" y="0" width="200" height="200" rx="30" fill="#1a1a2e"/>
  <rect x="3" y="3" width="194" height="194" rx="28" fill="none" stroke="url(#g6)" stroke-width="2"/>
  <!-- Monogramme SM entrelacé -->
  <text x="100" y="125" text-anchor="middle" font-family="Georgia,serif" font-size="72" font-weight="bold" fill="url(#g6)" letter-spacing="-2">SM</text>
  <!-- Trait diagonale -->
  <line x1="40" y1="140" x2="160" y2="140" stroke="url(#g6)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Texte -->
  <text x="100" y="160" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.7)" letter-spacing="4">SCHOOL MANAGER</text>
  <text x="100" y="178" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.4)" letter-spacing="6">BF</text>
  <!-- Petits points décoratifs -->
  <circle cx="45" cy="30" r="2" fill="url(#g6)" opacity="0.5"/>
  <circle cx="155" cy="30" r="2" fill="url(#g6)" opacity="0.5"/>
  <circle cx="45" cy="175" r="2" fill="url(#g6)" opacity="0.5"/>
  <circle cx="155" cy="175" r="2" fill="url(#g6)" opacity="0.5"/>
</svg>
<h3>Option 6 — Monogramme Teal</h3>
</div>
</body></html>
