<!DOCTYPE html>
<html><head><style>
body { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#1a1a2e; margin:0; }
.card { text-align:center; margin:20px; }
.card h3 { color:#fff; margin-top:15px; font-family:Arial; }
svg { filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4)); }
</style></head><body>
<div class="card">
<svg width="200" height="220" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E676"/>
      <stop offset="50%" style="stop-color:#00C853"/>
      <stop offset="100%" style="stop-color:#00897B"/>
    </linearGradient>
  </defs>
  <!-- Hexagone -->
  <polygon points="100,8 178,54 178,146 100,192 22,146 22,54" fill="url(#g3)"/>
  <polygon points="100,18 168,58 168,142 100,182 32,142 32,58" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <!-- Cercle central -->
  <circle cx="100" cy="90" r="38" fill="rgba(0,0,0,0.2)"/>
  <circle cx="100" cy="90" r="34" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Lettres SM stylisées -->
  <text x="100" y="102" text-anchor="middle" font-family="Georgia,serif" font-size="44" font-weight="bold" fill="#fff" letter-spacing="2">SM</text>
  <!-- Étoile dorée -->
  <polygon points="100,50 103,58 112,58 105,63 108,72 100,67 92,72 95,63 88,58 97,58" fill="#FFD600"/>
  <!-- Texte -->
  <text x="100" y="145" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.9)" letter-spacing="2" font-weight="600">SCHOOL MANAGER</text>
  <text x="100" y="162" text-anchor="middle" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.5)" letter-spacing="4">BURKINA FASO</text>
</svg>
<h3>Option 3 — Hexagone Moderne</h3>
</div>
</body></html>
