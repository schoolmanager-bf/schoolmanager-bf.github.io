<!DOCTYPE html>
<html><head><style>
body { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#1a1a2e; margin:0; }
.card { text-align:center; margin:20px; }
.card h3 { color:#fff; margin-top:15px; font-family:Arial; }
svg { filter: drop-shadow(0 4px 16px rgba(0,0,0,0.5)); }
</style></head><body>
<div class="card">
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#212121"/>
      <stop offset="100%" style="stop-color:#000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD600"/>
      <stop offset="100%" style="stop-color:#FFA000"/>
    </linearGradient>
  </defs>
  <!-- Cercle noir -->
  <circle cx="100" cy="100" r="95" fill="url(#g4)"/>
  <!-- Anneau doré -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>
  <!-- Chapeau simple -->
  <polygon points="55,88 100,60 145,88" fill="url(#gold)"/>
  <rect x="60" y="85" width="80" height="7" rx="3" fill="url(#gold)"/>
  <line x1="100" y1="60" x2="130" y2="78" stroke="#F44336" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="130" cy="78" r="3.5" fill="#F44336"/>
  <!-- SM doré -->
  <text x="100" y="128" text-anchor="middle" font-family="Georgia,serif" font-size="40" font-weight="bold" fill="url(#gold)" letter-spacing="5">SM</text>
  <!-- Ligne -->
  <line x1="55" y1="140" x2="145" y2="140" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="100" y="158" text-anchor="middle" font-family="Arial" font-size="10" fill="url(#gold)" letter-spacing="4" opacity="0.8">SCHOOL MANAGER</text>
</svg>
<h3>Option 4 — Premium Noir & Or</h3>
</div>
</body></html>
