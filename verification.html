<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a2747">
    <title>Vérification - Yiriba</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(160deg, #eef2f7 0%, #dde6f0 100%);
            color: #223; min-height: 100vh;
        }
        .app { max-width: 480px; margin: 0 auto; padding: 16px 14px 40px; }
        header {
            background: linear-gradient(135deg, #1a2747, #2c3e6b);
            color: #fff; border-radius: 16px; padding: 20px 16px; text-align: center;
            box-shadow: 0 4px 14px rgba(44,62,107,.25);
        }
        header .flag { font-size: 28px; }
        header h1 { margin: 6px 0 2px; font-size: 20px; }
        header p { font-size: 12px; opacity: .8; }
        .card {
            background: #fff; border-radius: 14px; padding: 16px; margin-top: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,.07);
        }
        .verdict {
            text-align: center; padding: 20px; border-radius: 12px; margin-bottom: 14px;
            font-size: 15px; font-weight: 600;
        }
        .verdict.ok { background: #e8f5e9; border: 2px solid #4caf50; color: #2e7d32; }
        .verdict.warn { background: #fff3e0; border: 2px solid #ff9800; color: #e65100; }
        .verdict.bad { background: #ffebee; border: 2px solid #f44336; color: #c62828; }
        .verdict .icon { font-size: 36px; display: block; margin-bottom: 8px; }
        .info-grid {
            display: grid; grid-template-columns: 110px 1fr; gap: 6px; font-size: 13px;
        }
        .info-label { color: #888; }
        .info-value { font-weight: 600; }
        .info-value.big { font-size: 18px; color: #1565c0; }
        .badge {
            display: inline-block; padding: 3px 10px; border-radius: 20px;
            font-size: 11px; font-weight: 700; margin-bottom: 10px;
        }
        .badge.bul { background: #e3f2fd; color: #1565c0; }
        .badge.rec { background: #e8f5e9; color: #2e7d32; }
        .badge.sig { background: #f3e5f5; color: #7b1fa2; }
        .school { font-size: 16px; font-weight: 700; color: #1a2747; margin: 8px 0; }
        .manual { margin-top: 14px; }
        .manual h3 { font-size: 13px; margin-bottom: 8px; }
        .manual textarea {
            width: 100%; border: 1px solid #ddd; border-radius: 10px; padding: 10px;
            font-size: 13px; font-family: monospace; resize: none; height: 60px;
        }
        .btn {
            display: block; width: 100%; border: 0; border-radius: 12px; padding: 13px;
            font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px;
        }
        .btn-primary { background: #1a2747; color: #fff; }
        .btn-ghost { background: #f1f3f6; color: #334; }
        footer {
            text-align: center; margin-top: 20px; font-size: 11px; color: #999;
        }
        footer a { color: #1a2747; text-decoration: none; }
        .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #ddd;
            border-top-color: #1a2747; border-radius: 50%; animation: spin .7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading { text-align: center; padding: 30px; }
    
        /* WhatsApp Flottant */
        .wa-float{position:fixed;bottom:30px;right:30px;z-index:9999;display:flex;align-items:center;gap:12px;text-decoration:none}
        .wa-float .wa-label{background:#fff;color:#128C7E;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 4px 15px rgba(0,0,0,.2);white-space:nowrap;opacity:0;transform:translateX(20px);transition:.3s;pointer-events:none}
        .wa-float:hover .wa-label{opacity:1;transform:translateX(0)}
        .wa-float .wa-icon{width:60px;height:60px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 20px rgba(37,211,102,.4);transition:.3s;animation:wa-pulse 2s infinite}
        .wa-float:hover .wa-icon{transform:scale(1.1);box-shadow:0 6px 25px rgba(37,211,102,.6)}
        @keyframes wa-pulse{0%,100%{box-shadow:0 4px 20px rgba(37,211,102,.4)}50%{box-shadow:0 4px 30px rgba(37,211,102,.7)}}
    </style>

    <meta property="og:title" content="Verification - Yiriba">
    <meta property="og:description" content="Verifiez l'authenticite d'un bulletin ou recu Yiriba via le code QR.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://schoolmanager-bf.github.io/verification.html">
    <meta property="og:image" content="https://schoolmanager-bf.github.io/screenshots/dashboard.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Verification - Yiriba">
    <meta name="twitter:description" content="Verifiez l'authenticite d'un bulletin ou recu Yiriba via le code QR.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://schoolmanager-bf.github.io/verification.html">
</head>
<body>
<div class="app">
    <header>
        <div class="flag">🇧🇫</div>
        <h1>Yiriba</h1>
        <p>Vérification d'authenticité des documents</p>
    </header>

    <!-- Loading -->
    <div id="loading" class="card">
        <div class="spinner"></div>
        <p style="margin-top:10px;color:#888;">Vérification en cours...</p>
    </div>

    <!-- Resultat (caché au départ) -->
    <div id="result" style="display:none;">
        <div id="verdict" class="verdict"></div>
        <div class="card">
            <div id="badge" class="badge bul">BULLETIN</div>
            <div id="school" class="school"></div>
            <div id="infos" class="info-grid"></div>
        </div>
    </div>

    <!-- Saisie manuelle -->
    <div class="card manual">
        <h3>📋 Saisie manuelle du QR code</h3>
        <textarea id="manual" placeholder="Collez le contenu du QR ici..."></textarea>
        <button class="btn btn-primary" id="btnVerify">✅ Vérifier</button>
    </div>

    <footer>
        Powered by <a href="https://schoolmanager-bf.github.io">Yiriba</a><br>
        La Patrie ou la Mort, nous vaincrons
    </footer>
</div>

<script>
(async function() {
    const params = new URLSearchParams(window.location.search);
    let d = params.get('d') || '';

    if (d) {
        // URL décoder et remplacer %7C par |
        d = decodeURIComponent(d.replace(/%7C/gi, '|'));
        await showResult(d);
    } else {
        // Pas de paramètre → afficher le formulaire de saisie
        document.getElementById('loading').style.display = 'none';
    }

    // Bouton vérifier
    document.getElementById('btnVerify').addEventListener('click', async () => {
        const val = document.getElementById('manual').value.trim();
        if (val) await showResult(val);
    });
})();

async function showResult(data) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('result').style.display = 'block';
    document.getElementById('manual').value = data;

    const parts = data.split('|');
    const type = (parts[0] || '').toUpperCase();
    const verdict = document.getElementById('verdict');
    const badge = document.getElementById('badge');
    const school = document.getElementById('school');
    const infos = document.getElementById('infos');

    if (type === 'SM-BUL') {
        // SM-BUL|matricule|période|moyenne|nom|classe|hmac
        const mat = parts[1] || '?';
        const periode = parts[2] || '?';
        const moyenne = parts[3] || '?';
        const nom = parts[4] || '';
        const classe = parts[5] || '';
        const hmac = parts[6] || '';

        badge.className = 'badge bul';
        badge.textContent = '📄 BULLETIN';
        school.textContent = nom || 'Élève';

        infos.innerHTML = `
            <div class="info-label">Matricule</div><div class="info-value">${mat}</div>
            ${nom ? `<div class="info-label">Nom</div><div class="info-value">${nom}</div>` : ''}
            ${classe ? `<div class="info-label">Classe</div><div class="info-value">${classe}</div>` : ''}
            <div class="info-label">Période</div><div class="info-value">${periode}</div>
            <div class="info-label">Moyenne</div><div class="info-value big">${moyenne}/20</div>
            ${hmac ? `<div class="info-label">Empreinte</div><div class="info-value" style="font-family:monospace;font-size:11px;">${hmac}</div>` : ''}
        `;

        verdict.className = 'verdict ok';
        verdict.innerHTML = `<span class="icon">✅</span><strong>Document vérifiable</strong><br>Comparez avec le document papier.`;

    } else if (type === 'SM-REC') {
        // SM-REC|id|nom|montant|date|hmac
        const id = parts[1] || '?';
        const nom = parts[2] || '?';
        const montant = parts[3] || '?';
        const date = parts[4] || '?';
        const hmac = parts[5] || '';

        let dateStr = date;
        if (date.length === 8) dateStr = date.substring(6,8) + '/' + date.substring(4,6) + '/' + date.substring(0,4);

        badge.className = 'badge rec';
        badge.textContent = '💰 REÇU DE PAIEMENT';
        school.textContent = nom;

        infos.innerHTML = `
            <div class="info-label">N° Reçu</div><div class="info-value">${id}</div>
            <div class="info-label">Élève</div><div class="info-value">${nom}</div>
            <div class="info-label">Montant</div><div class="info-value big">${montant} FCFA</div>
            <div class="info-label">Date</div><div class="info-value">${dateStr}</div>
            ${hmac ? `<div class="info-label">Empreinte</div><div class="info-value" style="font-family:monospace;font-size:11px;">${hmac}</div>` : ''}
        `;

        verdict.className = 'verdict ok';
        verdict.innerHTML = `<span class="icon">✅</span><strong>Reçu vérifiable</strong><br>Comparez avec le reçu papier.`;

    } else if (type === 'SM-SIG') {
        badge.className = 'badge sig';
        badge.textContent = '🔐 DOCUMENT SIGNÉ';
        school.textContent = 'Signature électronique';
        infos.innerHTML = `
            <div class="info-label">ID Signature</div><div class="info-value" style="font-family:monospace;">${parts[1] || '?'}</div>
        `;
        verdict.className = 'verdict warn';
        verdict.innerHTML = `<span class="icon">⏳</span><strong>Vérification requise</strong><br>Contactez l'école pour valider.`;

    } else {
        verdict.className = 'verdict bad';
        verdict.innerHTML = `<span class="icon">❓</span><strong>Document inconnu</strong><br>Type non reconnu : ${type}`;
    }
}
</script>
