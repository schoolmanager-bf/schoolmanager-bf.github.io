<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yiriba Admin — Gestion des licences</title>
    <link rel="icon" href="assets/logo-yiriba.svg" type="image/svg+xml">
    <style>
        :root {
            --bg: #0a0e17;
            --card: #111827;
            --border: #1e293b;
            --text: #e2e8f0;
            --muted: #64748b;
            --green: #10b981;
            --red: #ef4444;
            --yellow: #f59e0b;
            --blue: #3b82f6;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,sans-serif; min-height:100vh; }

        /* LOGIN */
        .login-screen { display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .login-box { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:48px; width:400px; text-align:center; }
        .login-box h1 { font-size:28px; margin-bottom:8px; }
        .login-box .subtitle { color:var(--muted); margin-bottom:32px; }
        .login-box input { width:100%; padding:14px 18px; background:var(--bg); border:1px solid var(--border); border-radius:10px; color:var(--text); font-size:16px; margin-bottom:16px; outline:none; }
        .login-box input:focus { border-color:var(--green); }
        .login-box button { width:100%; padding:14px; background:var(--green); color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; transition:.2s; }
        .login-box button:hover { background:#059669; }
        .login-error { color:var(--red); font-size:14px; margin-top:12px; display:none; }

        /* DASHBOARD */
        .dashboard { display:none; }
        .topbar { background:var(--card); border-bottom:1px solid var(--border); padding:16px 32px; display:flex; justify-content:space-between; align-items:center; }
        .topbar h2 { font-size:20px; }
        .topbar .logout { color:var(--red); cursor:pointer; font-size:14px; font-weight:600; background:none; border:none; }
        .content { padding:32px; max-width:1200px; margin:0 auto; }

        /* STATS */
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:32px; }
        .stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; text-align:center; }
        .stat-card .number { font-size:36px; font-weight:800; }
        .stat-card .label { color:var(--muted); font-size:13px; margin-top:4px; }
        .stat-card.green .number { color:var(--green); }
        .stat-card.red .number { color:var(--red); }
        .stat-card.blue .number { color:var(--blue); }
        .stat-card.yellow .number { color:var(--yellow); }

        /* TABLE */
        .table-card { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:24px; }
        .table-header { padding:20px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
        .table-header h3 { font-size:16px; }
        table { width:100%; border-collapse:collapse; }
        th { text-align:left; padding:12px 24px; font-size:12px; text-transform:uppercase; color:var(--muted); letter-spacing:1px; border-bottom:1px solid var(--border); }
        td { padding:14px 24px; font-size:14px; border-bottom:1px solid rgba(255,255,255,.03); }
        tr:hover { background:rgba(255,255,255,.02); }
        .badge { padding:4px 12px; border-radius:50px; font-size:12px; font-weight:600; }
        .badge-active { background:rgba(16,185,129,.15); color:var(--green); }
        .badge-revoked { background:rgba(239,68,68,.15); color:var(--red); }
        .btn-sm { padding:6px 16px; border:none; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; margin:0 4px; }
        .btn-revoke { background:rgba(239,68,68,.15); color:var(--red); }
        .btn-reactivate { background:rgba(16,185,129,.15); color:var(--green); }
        .btn-sm:hover { opacity:.8; }

        /* REVOKE FORM */
        .revoke-form { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; margin-bottom:24px; }
        .revoke-form h3 { margin-bottom:16px; font-size:16px; }
        .revoke-form .row { display:flex; gap:12px; }
        .revoke-form input { flex:1; padding:12px 16px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-size:14px; outline:none; }
        .revoke-form input:focus { border-color:var(--green); }
        .revoke-form button { padding:12px 24px; border:none; border-radius:8px; font-weight:600; cursor:pointer; }
        .revoke-btn { background:var(--red); color:#fff; }
        .reactivate-btn { background:var(--green); color:#fff; }
        .toast { position:fixed; bottom:24px; right:24px; padding:16px 24px; border-radius:10px; font-weight:600; z-index:999; animation:slideIn .3s; }
        .toast-success { background:var(--green); color:#fff; }
        .toast-error { background:var(--red); color:#fff; }
        @keyframes slideIn { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }

        .loading { text-align:center; padding:40px; color:var(--muted); }
    </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <div style="font-size:48px;margin-bottom:16px;">🔐</div>
        <h1>Yiriba Admin</h1>
        <p class="subtitle">Gestion des licences</p>
        <input type="password" id="passwordInput" placeholder="Mot de passe admin" autofocus onkeydown="if(event.key==='Enter')login()">
        <button onclick="login()">Se connecter</button>
        <p class="login-error" id="loginError">Mot de passe incorrect</p>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
    <div class="topbar">
        <h2>🌳 Yiriba — Admin</h2>
        <button class="logout" onclick="logout()">Déconnexion</button>
    </div>
    <div class="content">
        <!-- STATS -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card blue"><div class="number" id="statTotal">...</div><div class="label">Total licences</div></div>
            <div class="stat-card green"><div class="number" id="statActive">...</div><div class="label">Actives</div></div>
            <div class="stat-card red"><div class="number" id="statRevoked">...</div><div class="label">Révoquées</div></div>
            <div class="stat-card yellow"><div class="number" id="statPacks">...</div><div class="label">Packs</div></div>
        </div>

        <!-- REVOKE/REACTIVATE -->
        <div class="revoke-form">
            <h3>⚡ Action rapide</h3>
            <div class="row">
                <input type="text" id="actionInput" placeholder="Nom de l'école ou Hardware ID">
                <button class="revoke-btn" onclick="revokeLicense()">🚫 Révoquer</button>
                <button class="reactivate-btn" onclick="reactivateLicense()">✅ Réactiver</button>
            </div>
        </div>

        <!-- LIST -->
        <div class="table-card">
            <div class="table-header">
                <h3>📋 Licences</h3>
                <button class="btn-sm btn-reactivate" onclick="loadData()">🔄 Rafraîchir</button>
            </div>
            <table>
                <thead>
                    <tr><th>École</th><th>Pack</th><th>Hardware ID</th><th>Activation</th><th>Expire</th><th>Élèves max</th><th>Statut</th></tr>
                </thead>
                <tbody id="licenseTable">
                    <tr><td colspan="7" class="loading">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
const API = 'https://yiriba-license.onrender.com';
const ADMIN_PASSWORD = 'yiriba-admin-2026';
let token = '';

function login() {
    const pw = document.getElementById('passwordInput').value;
    if (pw !== ADMIN_PASSWORD) {
        document.getElementById('loginError').style.display = 'block';
        return;
    }
    token = btoa(pw);
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadData();
}

function logout() {
    token = '';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('passwordInput').value = '';
}

function toast(msg, type) {
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
}

async function loadData() {
    try {
        const res = await fetch(`${API}/api/admin/list`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.error) { toast(data.error, 'error'); return; }

        document.getElementById('statTotal').textContent = data.total || 0;
        document.getElementById('statActive').textContent = data.active || 0;
        document.getElementById('statRevoked').textContent = data.revoked || 0;
        document.getElementById('statPacks').textContent = data.by_pack ? Object.keys(data.by_pack).length : 0;

        const licenses = data.licenses || [];
        const tbody = document.getElementById('licenseTable');
        if (licenses.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="loading">Aucune licence</td></tr>';
            return;
        }
        tbody.innerHTML = licenses.map(l => `
            <tr>
                <td><strong>${l.school_name}</strong></td>
                <td>${l.pack}</td>
                <td style="font-family:monospace;font-size:12px;">${l.hardware_id || '—'}</td>
                <td>${l.date_activation || '—'}</td>
                <td>${l.date_expiration || '—'}</td>
                <td>${l.max_eleves === -1 ? '∞' : l.max_eleves}</td>
                <td>${l.is_revoked
                    ? '<span class="badge badge-revoked">Révoquée</span>'
                    : '<span class="badge badge-active">Active</span>'
                }</td>
            </tr>
        `).join('');
    } catch (e) {
        toast('Erreur de connexion: ' + e.message, 'error');
    }
}

async function revokeLicense() {
    const input = document.getElementById('actionInput').value.trim();
    if (!input) { toast('Entrez un nom d\'école', 'error'); return; }
    try {
        const res = await fetch(`${API}/api/admin/revoke-quick`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ school_name: input, code: 'yiriba-revoke-2026' })
        });
        const data = await res.json();
        if (data.success) { toast(`Licence "${input}" révoquée !`, 'success'); loadData(); }
        else toast(data.error, 'error');
    } catch (e) { toast('Erreur: ' + e.message, 'error'); }
}

async function reactivateLicense() {
    const input = document.getElementById('actionInput').value.trim();
    if (!input) { toast('Entrez un nom d\'école', 'error'); return; }
    try {
        const res = await fetch(`${API}/api/admin/reactivate-quick`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ school_name: input, code: 'yiriba-revoke-2026' })
        });
        const data = await res.json();
        if (data.success) { toast(`Licence "${input}" réactivée !`, 'success'); loadData(); }
        else toast(data.error, 'error');
    } catch (e) { toast('Erreur: ' + e.message, 'error'); }
}
</script>
</body>
</html>
